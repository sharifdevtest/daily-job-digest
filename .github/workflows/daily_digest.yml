name: Job Search Notification Pipeline

on:
  schedule:
    # 02:15 UTC = 07:45 AM IST. Accounts for GitHub delays + runtime.
    - cron: '15 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install requests beautifulsoup4

      - name: Run Job Pipeline
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          EMAIL_SENDER: ${{ secrets.SENDER_EMAIL }}
          EMAIL_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_RECIPIENT: ${{ secrets.RECIPIENT_EMAIL }}
          SMTP_SERVER: "smtp.gmail.com"
          SMTP_PORT: "587"
        run: python main.py

      - name: Commit and Push State Updates
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add seen_jobs.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update persistent seen_jobs store [skip ci]" && git push)